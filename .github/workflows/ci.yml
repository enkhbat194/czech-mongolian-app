name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - feat/a0-1-first-contact

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The current lockfile needs a local refresh. Keep the build gate active
      # instead of silently skipping lint/build while that maintenance is done.
      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Run quality gate
        run: npm run check
